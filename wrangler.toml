# Cloudflare Worker: static site + PATCH API (/api/guide/*). Deploy: npx wrangler deploy
# Secrets (never in this file): npx wrangler secret put GROQ_API_KEY   (see .dev.vars.example for the full list)
name = "david-mwiti-portfolio"
main = "server/worker.js"
compatibility_date = "2026-05-01"

[assets]
directory = "."            # filtered by .assetsignore so only the public site is uploaded
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Durable per-IP limit across isolates (per Cloudflare location). 12 messages / 60 s per visitor IP.
[[ratelimits]]
name = "GUIDE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[vars]
GROQ_MODEL = "openai/gpt-oss-120b"
OPENROUTER_MODEL = "openai/gpt-oss-20b"
LANGSMITH_PROJECT = "patch-portfolio"
